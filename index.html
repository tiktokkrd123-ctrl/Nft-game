<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Neon Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon: #00f2ff;
            --accent: #7000ff;
        }

        body {
            background: #050505;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0; padding: 20px;
            height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .nft-viewport {
            width: 280px; height: 380px;
            background: #000;
            border-radius: 30px;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid var(--neon);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            margin-bottom: 30px;
        }

        .nft-image {
            width: 220px; height: 220px;
            object-fit: contain;
            display: none;
            filter: drop-shadow(0 0 15px var(--neon));
        }

        .nft-name {
            margin-top: 20px;
            font-size: 24px; font-weight: bold;
            color: var(--neon);
            text-transform: uppercase;
        }

        .main-btn {
            background: white; color: black;
            border: none; padding: 18px 50px;
            font-size: 18px; font-weight: 800;
            border-radius: 100px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .main-btn:active { transform: scale(0.9); }

        .reveal { animation: revealEffect 0.5s ease-out forwards; }
        @keyframes revealEffect {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 12px; color: #888;">CURRENT BALANCE</div>
        <div style="font-size: 20px; font-weight: bold; margin-top: 5px;">
            💎 1.50 | ⭐️ <span id="stars">950</span>
        </div>
    </div>

    <div class="nft-viewport">
        <div id="status">SCANNING READY...</div>
        <img id="nft-img" class="nft-image" src="" alt="NFT">
        <div id="nft-title" class="nft-name"></div>
    </div>

    <button class="main-btn" onclick="openCase()">Unlock Box</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // НОВЫЕ СТАТИЧНЫЕ ССЫЛКИ, КОТОРЫЕ НЕ УДАЛЯТ
        const nfts = [
            {name: "Pepe Smart", img: "https://files.catbox.moe/kxt0v6.png"},
            {name: "Pepe Sad", img: "https://files.catbox.moe/u0p8i9.png"},
            {name: "Pepe Rich", img: "https://files.catbox.moe/8b72wa.png"},
            {name: "Pepe Warrior", img: "https://files.catbox.moe/3p719j.png"}
        ];

        function openCase() {
            let starsEl = document.getElementById('stars');
            let currentStars = parseInt(starsEl.innerText);

            if (currentStars < 50) {
                tg.showAlert("Not enough Stars!");
                return;
            }

            tg.HapticFeedback.impactOccurred("heavy");
            starsEl.innerText = currentStars - 50;

            const nft = nfts[Math.floor(Math.random() * nfts.length)];

            document.getElementById('status').style.display = 'none';
            const img = document.getElementById('nft-img');
            const title = document.getElementById('nft-title');

            img.src = nft.img;
            img.style.display = 'block';
            img.classList.remove('reveal');
            void img.offsetWidth; // Магия для перезапуска анимации
            img.classList.add('reveal');
            
            title.innerText = nft.name;
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
