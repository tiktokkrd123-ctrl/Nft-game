<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Fragment Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg: #0a0a0a;
            --fragment-blue: #0088cc;
            --gold: #f1c40f;
        }

        body {
            background-color: var(--tg-theme-bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 20px;
            width: 90%;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nft-card {
            width: 300px;
            height: 400px;
            background: #161616;
            border-radius: 25px;
            border: 1px solid rgba(0, 136, 204, 0.3);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        #nft-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: none;
        }

        .rarity-tag {
            position: absolute;
            top: 15px; right: 15px;
            background: var(--fragment-blue);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px; font-weight: bold;
            display: none;
        }

        .nft-name {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            color: #fff;
        }

        .btn-open {
            background: var(--fragment-blue);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            width: 90%;
            transition: 0.2s;
        }

        .btn-open:active { transform: scale(0.96); opacity: 0.9; }

        .reveal-anim { animation: reveal 0.6s ease-out; }
        @keyframes reveal {
            from { transform: scale(0.8); opacity: 0; filter: brightness(2); }
            to { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 12px; opacity: 0.5; margin-bottom: 5px;">FRAGMENT MARKETPLACE</div>
        <div style="font-size: 20px; font-weight: bold;">
            💎 1.50 TON | ⭐️ <span id="stars">950</span>
        </div>
    </div>

    <div class="nft-card">
        <div id="rarity" class="rarity-tag">RARE</div>
        <div id="placeholder" style="opacity: 0.3; font-weight: bold;">READY TO MINT</div>
        <img id="nft-img" src="" alt="NFT">
        <div id="nft-name" class="nft-name"></div>
    </div>

    <button class="btn-open" onclick="openCase()">OPEN MYSTERY BOX</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // РЕАЛЬНЫЕ ССЫЛКИ С FRAGMENT (Используем официальные аватары и анонимные номера)
        const fragmentNfts = [
            {name: "Diamond Dog", img: "https://fragment.com/img/nft/dog.webp", rarity: "LEGENDARY"},
            {name: "Anonymous #888", img: "https://fragment.com/img/nft/number.webp", rarity: "RARE"},
            {name: "Star Whale", img: "https://fragment.com/img/nft/whale.webp", rarity: "COMMON"}
        ];

        function openCase() {
            let starsEl = document.getElementById('stars');
            let current = parseInt(starsEl.innerText);

            if (current < 50) {
                tg.showAlert("Not enough Stars!");
                return;
            }

            // Списываем и вибрируем
            starsEl.innerText = current - 50;
            tg.HapticFeedback.impactOccurred("heavy");

            const nft = fragmentNfts[Math.floor(Math.random() * fragmentNfts.length)];

            // Скрываем текст, показываем картинку
            document.getElementById('placeholder').style.display = 'none';
            const img = document.getElementById('nft-img');
            const rarity = document.getElementById('rarity');
            const title = document.getElementById('nft-name');

            img.src = nft.img;
            img.style.display = 'block';
            img.className = 'reveal-anim';

            rarity.innerText = nft.rarity;
            rarity.style.display = 'block';
            rarity.style.background = nft.rarity === 'LEGENDARY' ? '#f1c40f' : '#0088cc';

            title.innerText = nft.name;

            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
