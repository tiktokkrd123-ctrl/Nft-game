<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Neon Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .balance { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; width: 85%; margin-bottom: 30px; border: 1px solid #333; display: flex; justify-content: space-around; font-weight: bold; }
        .nft-card { width: 280px; height: 380px; background: #0a0a0a; border-radius: 30px; border: 1px solid #00f2ff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,242,255,0.2); margin-bottom: 40px; position: relative; }
        #nft-img { width: 200px; height: 200px; object-fit: contain; display: none; }
        .nft-name { margin-top: 20px; font-size: 24px; font-weight: bold; color: #00f2ff; text-transform: uppercase; }
        .main-btn { background: white; color: black; border: none; padding: 20px 60px; font-size: 18px; font-weight: bold; border-radius: 100px; text-transform: uppercase; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .main-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="balance">
        <span>💎 1.50 TON</span>
        <span>⭐️ <span id="stars">950</span></span>
    </div>
    <div class="nft-card">
        <div id="status" style="opacity: 0.5;">READY TO UNLOCK</div>
        <img id="nft-img" src="" alt="NFT">
        <div id="nft-title" class="nft-name"></div>
    </div>
    <button class="main-btn" onclick="openBox()">Unlock Box</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Ссылки на картинки, которые Telegram точно пропустит
        const nfts = [
            {name: "TON Crystal", img: "https://raw.githubusercontent.com/ton-blockchain/ton/master/ton-logo.png"},
            {name: "Classic Pepe", img: "https://upload.wikimedia.org/wikipedia/en/1/1b/Pepe_the_Frog.png"},
            {name: "Premium Star", img: "https://telegram.org/img/emoji/40/2B50.png"}
        ];

        function openBox() {
            let s = document.getElementById('stars');
            let val = parseInt(s.innerText);
            if (val < 50) { tg.showAlert("Мало Stars!"); return; }

            s.innerText = val - 50;
            tg.HapticFeedback.impactOccurred("heavy");

            const item = nfts[Math.floor(Math.random() * nfts.length)];

            document.getElementById('status').style.display = 'none';
            const img = document.getElementById('nft-img');
            
            img.src = item.img;
            img.style.display = 'block';
            
            document.getElementById('nft-title').innerText = item.name;
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
