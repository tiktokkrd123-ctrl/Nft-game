<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Neon Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #000;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            width: 90%;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .nft-viewport {
            width: 280px;
            height: 380px;
            background: #0a0a0a;
            border-radius: 30px;
            border: 1px solid #00f2ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            margin-bottom: 40px;
        }

        #nft-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: none;
        }

        .nft-name {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #00f2ff;
        }

        .main-button {
            background: white;
            color: black;
            border: none;
            padding: 20px 60px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 100px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>💎 1.50 TON | ⭐️ <span id="stars">950</span></div>
    </div>

    <div class="nft-viewport">
        <div id="status" style="opacity: 0.5;">READY TO SCAN</div>
        <img id="nft-img" src="" alt="NFT">
        <div id="nft-title" class="nft-name"></div>
    </div>

    <button class="main-button" onclick="openCase()">Unlock Box</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Используем картинки напрямую с серверов Telegram
        const nfts = [
            {name: "TON Crystal", img: "https://telegram.org/img/t_logo.png"},
            {name: "Premium Star", img: "https://telegram.org/img/emoji/40/2B50.png"},
            {name: "Gold Medal", img: "https://telegram.org/img/emoji/40/1F947.png"}
        ];

        function openCase() {
            let starsEl = document.getElementById('stars');
            let currentStars = parseInt(starsEl.innerText);

            if (currentStars < 50) {
                tg.showAlert("Not enough Stars!");
                return;
            }

            tg.HapticFeedback.impactOccurred("heavy");
            starsEl.innerText = currentStars - 50;

            const nft = nfts[Math.floor(Math.random() * nfts.length)];

            document.getElementById('status').style.display = 'none';
            const img = document.getElementById('nft-img');
            
            img.src = nft.img;
            img.style.display = 'block';
            
            document.getElementById('nft-title').innerText = nft.name;
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
