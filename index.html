<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Battle App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .nft-card {
            width: 250px;
            height: 320px;
            background: #222831;
            border-radius: 20px;
            border: 2px solid #f05454;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        #nft-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: none; /* Скрыта до нажатия кнопки */
        }
        .btn-open {
            background: #f05454;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="nft-card">
        <img id="nft-img" src="" alt="NFT">
        <div id="status">КЕЙС ГОТОВ</div>
        <div id="nft-name" style="margin-top:10px; font-weight:bold;"></div>
    </div>

    <button class="btn-open" onclick="openCase()">ОТКРЫТЬ КЕЙС</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function openCase() {
            // Тряска телефона
            tg.HapticFeedback.impactOccurred("medium");

            // Берем картинку, которую ТЫ загрузил в GitHub
            const imgPath = "pepe.png"; 

            document.getElementById('status').style.display = 'none';
            const img = document.getElementById('nft-img');
            
            img.src = imgPath + "?v=" + Date.now(); // Добавляем хвост, чтобы не глючило при обновлении
            img.style.display = 'block';
            
            document.getElementById('nft-name').innerText = "PEPE NFT #001";
            
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
