<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Mystery Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --accent-blue: #0088cc;
            --text-main: #ffffff;
            --neon-glow: rgba(0, 136, 204, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка с балансом */
        .balance-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 20px;
            width: 85%;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }

        /* Карточка NFT */
        .nft-viewport {
            width: 290px;
            height: 380px;
            background: var(--card-bg);
            border-radius: 30px;
            border: 1px solid rgba(0, 136, 204, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--neon-glow);
            margin-bottom: 35px;
            position: relative;
        }

        #nft-image {
            width: 240px;
            height: 240px;
            object-fit: contain;
            display: none;
            filter: drop-shadow(0 0 15px var(--accent-blue));
        }

        .status-text {
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .nft-name {
            margin-top: 15px;
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
        }

        /* Кнопка открытия */
        .main-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 18px 0;
            width: 90%;
            border-radius: 18px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.3);
            transition: 0.2s;
        }

        .main-btn:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        /* Анимация появления */
        .reveal {
            animation: revealEffect 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes revealEffect {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="balance-container">
        <span>💎 1.50 TON</span>
        <span style="color: rgba(255,255,255,0.2)">|</span>
        <span>⭐️ <span id="stars-count">950</span></span>
    </div>

    <div class="nft-viewport">
        <div id="placeholder" class="status-text">Ready to Open</div>
        <img id="nft-image" src="" alt="NFT">
        <div id="nft-title" class="nft-name"></div>
    </div>

    <button class="main-btn" onclick="openCase()">Open for 50 ⭐️</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // Ссылки на GitHub, которые Telegram "любит"
        const items = [
            {
                name: "Pepe Classic", 
                img: "https://raw.githubusercontent.com/ProjectMoon-OpenSource/Moon-Assets/main/pepe/pepe-classic.png"
            },
            {
                name: "Pepe Detective", 
                img: "https://raw.githubusercontent.com/Ape-Swap/apeswap-art-assets/master/nfts/pepe-detective.png"
            },
            {
                name: "Gold Pepe", 
                img: "https://raw.githubusercontent.com/v1pun/Pepe-Assets/master/gold-pepe.png"
            }
        ];

        function openCase() {
            const starsEl = document.getElementById('stars-count');
            let balance = parseInt(starsEl.innerText);

            if (balance < 50) {
                tg.showAlert("Not enough Stars!");
                return;
            }

            // Списываем баланс и вибрируем
            starsEl.innerText = balance - 50;
            tg.HapticFeedback.impactOccurred("heavy");

            // Выбираем рандомный NFT
            const result = items[Math.floor(Math.random() * items.length)];

            // Скрываем надпись, показываем картинку
            document.getElementById('placeholder').style.display = 'none';
            const img = document.getElementById('nft-image');
            const title = document.getElementById('nft-title');

            // Магия перезагрузки анимации
            img.style.display = 'none';
            img.src = result.img + "?t=" + new Date().getTime(); // Обход кэша
            
            img.onload = function() {
                img.style.display = 'block';
                img.className = 'reveal';
                title.innerText = result.name;
                tg.HapticFeedback.notificationOccurred("success");
            };

            img.onerror = function() {
                tg.showAlert("Ошибка загрузки картинки. Попробуйте еще раз.");
            };
        }
    </script>
</body>
</html>
