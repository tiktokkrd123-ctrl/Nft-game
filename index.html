<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Mystery Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh;
        }

        .balance {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px; border-radius: 15px;
            width: 90%; margin-bottom: 20px;
            text-align: center; border: 1px solid #333;
        }

        .nft-display {
            width: 280px; height: 350px;
            background: #111;
            border-radius: 25px;
            border: 2px solid #00f2ff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Вместо обычного img используем блок с фоном */
        #photo-box {
            width: 220px; height: 220px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none; /* Появится при клике */
        }

        /* Запасной текст если картинка не алё */
        #fallback-icon {
            font-size: 80px;
            display: none;
        }

        .nft-name {
            margin-top: 20px; font-size: 22px; font-weight: bold;
            color: #00f2ff;
        }

        .btn {
            background: #fff; color: #000;
            border: none; padding: 20px; width: 90%;
            border-radius: 50px; font-size: 18px; font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="balance">
        💎 1.50 TON | ⭐️ <span id="stars">950</span>
    </div>

    <div class="nft-display">
        <div id="hint">КЕЙС ГОТОВ</div>
        <div id="photo-box"></div>
        <div id="fallback-icon">🎁</div>
        <div id="nft-title" class="nft-name"></div>
    </div>

    <button class="btn" onclick="openBox()">UNLOCK BOX</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Берем картинки с Википедии (их почти никогда не блочат)
        const items = [
            {name: "PEPE SMART", img: "https://upload.wikimedia.org/wikipedia/en/1/1b/Pepe_the_Frog.png", icon: "🧠"},
            {name: "GOLDEN TON", img: "https://cryptologos.cc/logos/toncoin-ton-logo.png", icon: "💰"}
        ];

        function openBox() {
            let s = document.getElementById('stars');
            let v = parseInt(s.innerText);
            if (v < 50) { tg.showAlert("Мало Stars!"); return; }

            s.innerText = v - 50;
            tg.HapticFeedback.impactOccurred("medium");

            const item = items[Math.floor(Math.random() * items.length)];

            document.getElementById('hint').style.display = 'none';
            
            const box = document.getElementById('photo-box');
            const fallback = document.getElementById('fallback-icon');
            
            // Пробуем поставить картинку фоном
            box.style.backgroundImage = "url('" + item.img + "')";
            box.style.display = 'block';
            
            // Если через 1 секунду высота блока 0 или ошибка — покажем эмодзи
            fallback.innerText = item.icon;
            fallback.style.display = 'block'; // Показываем иконку в любом случае как подложку

            document.getElementById('nft-title').innerText = item.name;
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
