<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Battle App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0; padding: 20px;
            height: 100vh; display: flex; flex-direction: column; align-items: center;
        }
        .balance-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 25px; width: 85%;
        }
        .card-display {
            width: 280px; height: 360px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 25px; border: 2px solid #ff2e63;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            margin-bottom: 30px; box-shadow: 0 0 20px rgba(255, 46, 99, 0.3);
            overflow: hidden;
        }
        #nft-img {
            width: 100%; height: 260px;
            object-fit: contain; display: none;
        }
        .nft-name { margin-top: 15px; font-size: 22px; font-weight: bold; color: #ff2e63; }
        .btn-open {
            background: #ff2e63; color: white; border: none;
            padding: 15px 40px; font-size: 18px; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 46, 99, 0.4);
        }
        .btn-open:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="balance-container">
        <div>💎 TON: 1.50</div>
        <div>⭐️ Stars: <span id="stars">950</span></div>
    </div>

    <div id="card-box" class="card-display">
        <img id="nft-img" src="" alt="NFT">
        <div id="placeholder" style="opacity: 0.5;">КЕЙС ГОТОВ К ОТКРЫТИЮ</div>
        <div id="nft-title" class="nft-name"></div>
    </div>

    <button class="btn-open" onclick="openCase()">ОТКРЫТЬ КЕЙС</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // НОВЫЕ ПРОВЕРЕННЫЕ ССЫЛКИ
        const nfts = [
            {name: "Sad Pepe", img: "https://i.ibb.co/vzP6YmX/pepe.jpg"}, 
            {name: "Rich Pepe", img: "https://i.pinimg.com/originals/9b/64/73/9b6473950f2425026217469a4732628c.png"},
            {name: "Classic Frog", img: "https://static.wikia.nocookie.net/meme/images/7/7e/Pepe_the_Frog.png"}
        ];

        function openCase() {
            let starsEl = document.getElementById('stars');
            let currentStars = parseInt(starsEl.innerText);
            if (currentStars < 50) { tg.showAlert("Мало Stars!"); return; }

            starsEl.innerText = currentStars - 50;
            tg.HapticFeedback.impactOccurred("medium");

            const randomNft = nfts[Math.floor(Math.random() * nfts.length)];
            
            document.getElementById('placeholder').style.display = 'none';
            const img = document.getElementById('nft-img');
            
            // Устанавливаем новую картинку
            img.src = randomNft.img;
            img.style.display = 'block';
            
            document.getElementById('nft-title').innerText = randomNft.name;
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
