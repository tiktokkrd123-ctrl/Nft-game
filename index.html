<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Mystery Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .balance {
            background: #1c1c1e;
            padding: 15px 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            width: 85%;
            display: flex; justify-content: space-between;
            border: 1px solid #333;
        }

        .card {
            width: 280px; height: 380px;
            background: #1c1c1e;
            border-radius: 24px;
            border: 1px solid #0088cc;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 0 0 40px rgba(0, 136, 204, 0.2);
            margin-bottom: 40px;
            position: relative;
        }

        #nft-img {
            width: 200px; height: 200px;
            object-fit: contain;
            display: none;
            filter: drop-shadow(0 0 10px #0088cc);
        }

        .status-msg {
            font-size: 14px; color: #0088cc;
            letter-spacing: 2px; text-transform: uppercase;
        }

        .name {
            margin-top: 20px; font-size: 24px; font-weight: bold;
        }

        .open-btn {
            background: #0088cc;
            color: #fff; border: none;
            padding: 20px; width: 90%;
            border-radius: 16px; font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .open-btn:active { transform: scale(0.96); }

        .anim { animation: pop 0.5s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="balance">
        <span>💎 1.50 TON</span>
        <span>⭐️ <span id="stars">950</span></span>
    </div>

    <div class="card">
        <div id="msg" class="status-msg">Ready to Mint</div>
        <img id="nft-img" src="" alt="NFT">
        <div id="nft-title" class="name"></div>
    </div>

    <button class="open-btn" onclick="openBox()">OPEN FOR 50 ⭐️</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // ССЫЛКИ НА КАРТИНКИ С СЕРВЕРОВ TELEGRAM (CDN)
        const items = [
            {name: "TON Crystal", img: "https://telegram.org/img/t_logo.png"},
            {name: "Premium Star", img: "https://telegram.org/img/emoji/40/2B50.png"},
            {name: "Diamond NFT", img: "https://telegram.org/img/emoji/40/1F48E.png"}
        ];

        function openBox() {
            let s = document.getElementById('stars');
            let val = parseInt(s.innerText);
            if (val < 50) { tg.showAlert("Need more Stars!"); return; }

            s.innerText = val - 50;
            tg.HapticFeedback.impactOccurred("heavy");

            const item = items[Math.floor(Math.random() * items.length)];

            document.getElementById('msg').style.display = 'none';
            const img = document.getElementById('nft-img');
            img.src = item.img;
            img.style.display = 'block';
            img.className = 'anim';

            document.getElementById('nft-title').innerText = item.name;
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
