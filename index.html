<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Mystery Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh;
        }

        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 20px;
            width: 85%;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nft-card {
            width: 280px; height: 380px;
            background: #111;
            border-radius: 30px;
            border: 1px solid #00f2ff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            margin-bottom: 40px;
        }

        #nft-img {
            width: 200px; height: 200px;
            object-fit: contain;
            display: none; /* Скрыто до нажатия кнопки */
        }

        .nft-name {
            margin-top: 20px; font-size: 24px; font-weight: bold;
            color: #00f2ff; text-transform: uppercase;
        }

        .btn-open {
            background: #fff; color: #000;
            border: none; padding: 20px 60px;
            font-size: 18px; font-weight: 800;
            border-radius: 100px;
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div style="font-size: 20px; font-weight: bold; text-align: center;">
            💎 1.50 | ⭐️ <span id="stars">950</span>
        </div>
    </div>

    <div class="nft-card">
        <div id="status" style="opacity: 0.3;">READY TO OPEN</div>
        <img id="nft-img" src="" alt="NFT">
        <div id="nft-title" class="nft-name"></div>
    </div>

    <button class="btn-open" onclick="openBox()">UNLOCK BOX</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function openBox() {
            let s = document.getElementById('stars');
            let v = parseInt(s.innerText);
            if (v < 50) { tg.showAlert("Need Stars!"); return; }

            s.innerText = v - 50;
            tg.HapticFeedback.impactOccurred("heavy");

            document.getElementById('status').style.display = 'none';
            const img = document.getElementById('nft-img');
            
            // ПРЯМАЯ ССЫЛКА НА КАРТИНКУ (Пример: Лого TON)
            img.src = "https://raw.githubusercontent.com/ton-blockchain/ton/master/ton-logo.png";
            img.style.display = 'block';
            
            document.getElementById('nft-title').innerText = "CRYPTO TON #1";
            tg.HapticFeedback.notificationOccurred("success");
        }
    </script>
</body>
</html>
